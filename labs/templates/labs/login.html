<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · VM Lab Workspace</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex align-items-center min-vh-100">
  <main class="container" style="max-width: 420px;">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1"><i class="bi bi-hdd-network me-2"></i>VM Lab Workspace</h1>
        <p class="text-body-secondary small mb-4">Log in with your Proxmox account.</p>

        {% for message in messages %}
          <div class="alert alert-warning small py-2">{{ message }}</div>
        {% endfor %}

        {% if proxmox_error %}
          <div class="alert alert-danger small py-2">{{ proxmox_error }}</div>
        {% elif form.errors %}
          <div class="alert alert-danger small py-2">Login failed. Check your username and password.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input class="form-control" id="id_username" name="username" placeholder="student1"
                   value="{{ form.username.value|default:'' }}" required autofocus>
            <div class="form-text">Realm defaults to <code>@pve</code> if you leave it off.</div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="id_password">Password</label>
            <input class="form-control" id="id_password" name="password" type="password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
